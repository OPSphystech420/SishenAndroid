//NDK-BUILD (JNI)
//
apply plugin: 'com.android.application'

android {
    namespace 'ark.use.sishen'
    compileSdkVersion 35
    def sdkDir = android.sdkDirectory
    ndkVersion = "29.0.13113456"//27.0.12077973
    ndkPath = "$sdkDir/ndk/29.0.13113456-obf"//27.0.12077973-obf
    defaultConfig {
        applicationId "ark.use.sishen"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
        signingConfig signingConfigs.debug

        /* externalNativeBuild {
            ndkBuild {

                def ndkDir = android.ndkDirectory
                def obfLib = "$ndkDir/toolchains/llvm/prebuilt/darwin-x86_64/lib/libHikari.so"

                cFlags  "-fvisibility=hidden",
                        "-fpass-plugin=${obfLib}",
                        "-Xclang", "-load", "-Xclang=${obfLib}"
                cppFlags "-fvisibility=hidden",
                        "-fpass-plugin=${obfLib}",
                        "-Xclang", "-load", "-Xclang=${obfLib}"

                cppFlags "-mllvm", "-enable-strcry"
            }
        } */

    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path file('src/main/cpp/Android.mk')
        }
    }
    namespace 'ark.use.sishen'
    buildToolsVersion '35.0.0'

}

//dependencies must be placed below 'of' brackets to get it work on AIDE
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}


